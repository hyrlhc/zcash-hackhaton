[package]
name = "zclaim-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WebAssembly bindings for ZClaim: a wallet that proves, and a verifier that checks."

[lib]
crate-type = ["cdylib", "rlib"]

# Note the absence of `multicore` anywhere below. halo2's parallel proving
# needs wasm atomics, which stable Rust cannot target, so this crate is the one
# consumer that leaves the feature off across the whole graph.
[dependencies]
zclaim-circuits = { workspace = true, features = ["test-fixtures"] }
zclaim-core.workspace = true
zclaim-inference.workspace = true
zclaim-proof.workspace = true
zclaim-protocol.workspace = true
zclaim-zcash.workspace = true

ff.workspace = true
hex.workspace = true
pasta_curves.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true

wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"

# `OsRng` reaches for the platform entropy source, which on wasm32 is
# `crypto.getRandomValues`. Without this feature the crate refuses to build for
# the target rather than silently returning predictable bytes.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
