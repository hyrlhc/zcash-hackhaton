[package]
name = "zclaim-proof"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Proving and verification for ZClaim, over Halo2 IPA on the Pasta curves."

[dependencies]
zclaim-circuits.workspace = true
zclaim-core.workspace = true

halo2_proofs.workspace = true
pasta_curves.workspace = true
ff.workspace = true
hex.workspace = true
rand.workspace = true
serde.workspace = true
thiserror.workspace = true

[features]
default = ["multicore"]
# Parallel proving. Off for wasm32, which has no atomics on stable Rust.
multicore = ["halo2_proofs/multicore", "zclaim-circuits/multicore"]

[dev-dependencies]
zclaim-circuits = { workspace = true, features = ["test-fixtures"] }
serde_json.workspace = true
